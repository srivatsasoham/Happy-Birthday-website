<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Video Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Great+Vibes&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    background:#080817;
    color:white;
    font-family:'Montserrat',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* =========================
   INPUT SCREEN
========================= */

.input-screen{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at 20% 20%, #ff5fa240, transparent 30%),
        radial-gradient(circle at 80% 80%, #7b61ff40, transparent 30%),
        #080817;
}

.input-box{
    width:90%;
    max-width:500px;
    padding:45px 35px;
    border-radius:30px;

    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.18);

    text-align:center;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.5);
}

.input-box h1{
    font-family:'Great Vibes',cursive;
    font-size:55px;
    margin-bottom:10px;
}

.input-box p{
    opacity:.75;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:16px 20px;
    border:none;
    outline:none;

    border-radius:15px;

    background:rgba(255,255,255,.1);
    color:white;

    font-size:17px;
    text-align:center;

    border:1px solid rgba(255,255,255,.2);
}

input::placeholder{
    color:#aaa;
}

button{
    margin-top:20px;

    padding:15px 30px;

    border:none;
    border-radius:50px;

    background:linear-gradient(
        135deg,
        #ff5fa2,
        #9b6cff
    );

    color:white;

    font-size:16px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 10px 30px #ff5fa240;

    transition:.3s;
}

button:hover{
    transform:scale(1.06);
}

/* =========================
   BIRTHDAY SCREEN
========================= */

.birthday{
    display:none;

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 35%,
            #ff6fa533,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #11112b,
            #25183d,
            #11152f
        );
}

/* =========================
   WATERMARK BACKGROUND
========================= */

.watermarks{
    position:absolute;
    inset:-20%;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    grid-auto-rows:120px;

    transform:rotate(-20deg) scale(1.2);

    opacity:.075;

    pointer-events:none;
}

.watermarks span{

    font-family:'Bebas Neue',sans-serif;

    font-size:35px;

    color:#fff;

    white-space:nowrap;

    letter-spacing:3px;
}

/* =========================
   CONTENT
========================= */

.content{
    position:absolute;

    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    text-align:center;

    z-index:10;
}

.small-text{
    font-size:18px;
    letter-spacing:6px;

    text-transform:uppercase;

    opacity:.8;

    animation:
        fadeUp 1s ease forwards;
}

.main-title{

    margin-top:15px;

    font-family:'Bebas Neue',sans-serif;

    font-size:
        clamp(70px,12vw,150px);

    line-height:.85;

    letter-spacing:5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ffb7d8,
            #d4c2ff,
            #fff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    text-shadow:
        0 0 30px #ff6fa255;

    animation:
        titleIn 1.5s cubic-bezier(.2,.8,.2,1);
}

.name{
    font-family:'Great Vibes',cursive;

    font-size:
        clamp(55px,9vw,110px);

    margin-top:20px;

    color:#ffd6e8;

    text-shadow:
        0 0 20px #ff77b2,
        0 0 50px #ff77b266;

    animation:
        nameIn 1.8s ease;
}

.message{
    margin-top:25px;

    font-size:16px;

    letter-spacing:3px;

    opacity:.8;
}

/* =========================
   CAKE
========================= */

.cake{
    position:relative;

    width:150px;
    height:100px;

    margin-top:50px;

    animation:
        cakeFloat 3s ease-in-out infinite;
}

.cake-body{

    position:absolute;

    bottom:0;
    left:0;

    width:150px;
    height:70px;

    border-radius:
        15px 15px 20px 20px;

    background:
        linear-gradient(
            #ff91b8,
            #d85c91
        );

    box-shadow:
        0 15px 30px #0006;
}

.cake-top{

    position:absolute;

    top:15px;

    left:0;

    width:150px;
    height:30px;

    border-radius:50%;

    background:#ffd3e3;
}

.cream{
    position:absolute;

    top:30px;

    width:100%;
    height:15px;

    background:#fff;

    border-radius:50%;
}

.candle{

    position:absolute;

    width:12px;
    height:35px;

    background:
        repeating-linear-gradient(
            45deg,
            #fff 0 5px,
            #ff75ad 5px 10px
        );

    top:-20px;

    border-radius:5px;
}

.candle:nth-child(1){
    left:45px;
}

.candle:nth-child(2){
    left:69px;
}

.candle:nth-child(3){
    left:93px;
}

.flame{

    position:absolute;

    width:14px;
    height:20px;

    background:#ffd166;

    border-radius:
        50% 50% 50% 50%;

    top:-40px;

    left:-1px;

    box-shadow:
        0 0 15px #ffd166,
        0 0 30px #ff9f1c;

    animation:
        flame .5s infinite alternate;
}

/* =========================
   BALLOONS
========================= */

.balloon{

    position:absolute;

    width:80px;
    height:100px;

    border-radius:
        50% 50% 45% 45%;

    opacity:.8;

    animation:
        balloonFloat 5s ease-in-out infinite;
}

.balloon::after{

    content:"";

    position:absolute;

    width:2px;
    height:100px;

    background:#ffffff66;

    top:95px;
    left:50%;
}

.b1{
    left:7%;
    top:20%;

    background:#ff72aa;

}

.b2{
    right:8%;
    top:25%;

    background:#9b7bff;

    animation-delay:1s;
}

.b3{
    left:15%;
    bottom:15%;

    background:#ffbd69;

    animation-delay:2s;
}

.b4{
    right:16%;
    bottom:18%;

    background:#65d9ff;

    animation-delay:1.5s;
}

/* =========================
   CONFETTI
========================= */

.confetti{

    position:absolute;

    width:8px;
    height:18px;

    top:-30px;

    animation:
        fall linear infinite;
}

/* =========================
   PARTICLES
========================= */

.particle{

    position:absolute;

    width:5px;
    height:5px;

    background:white;

    border-radius:50%;

    opacity:.7;

    animation:
        sparkle 3s infinite;
}

/* =========================
   RECORD BUTTON
========================= */

.controls{

    position:absolute;

    bottom:30px;

    left:50%;

    transform:translateX(-50%);

    z-index:30;
}

.recording{

    background:#ff4d6d;

    animation:pulse 1s infinite;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes titleIn{

    from{
        opacity:0;
        transform:
            scale(.5)
            rotate(-5deg);
    }

    to{
        opacity:1;
        transform:
            scale(1)
            rotate(0);
    }
}

@keyframes nameIn{

    from{
        opacity:0;
        transform:
            translateY(50px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

@keyframes cakeFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-12px);
    }
}

@keyframes flame{

    from{
        transform:scale(1);
    }

    to{
        transform:
            scale(1.2)
            rotate(3deg);
    }
}

@keyframes balloonFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(-3deg);
    }

    50%{
        transform:
            translateY(-30px)
            rotate(4deg);
    }
}

@keyframes fall{

    to{
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}

@keyframes sparkle{

    0%,100%{
        transform:scale(.5);
        opacity:.2;
    }

    50%{
        transform:scale(1.5);
        opacity:1;
    }
}

@keyframes pulse{

    50%{
        transform:scale(1.05);
    }
}

</style>
</head>

<body>

<!-- =========================
     NAME INPUT
========================= -->

<div class="input-screen" id="inputScreen">

    <div class="input-box">

        <h1>Birthday Magic ✨</h1>

        <p>
            Enter the birthday person's name
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Enter name..."
            maxlength="25"
        >

        <button onclick="startBirthday()">
            🎂 Create Birthday
        </button>

    </div>

</div>


<!-- =========================
     BIRTHDAY VIDEO
========================= -->

<div class="birthday" id="birthday">

    <!-- Watermark Background -->

    <div class="watermarks" id="watermarks"></div>

    <!-- Balloons -->

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <!-- Main Content -->

    <div class="content">

        <div class="small-text">
            Today is all about you ✨
        </div>

        <div class="main-title">
            HAPPY<br>
            BIRTHDAY
        </div>

        <div class="name" id="birthdayName">
            NAME!!!
        </div>

        <div class="message">
            Wishing you happiness, love & beautiful memories 💖
        </div>

        <!-- Cake -->

        <div class="cake">

            <div class="cake-body"></div>

            <div class="cake-top"></div>

            <div class="cream"></div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

            <div class="candle">
                <div class="flame"></div>
            </div>

        </div>

    </div>

    <!-- Controls -->

    <div class="controls">

        <button id="recordBtn" onclick="recordVideo()">
            🎥 Create Video
        </button>

    </div>

</div>


<script>

/* =========================
   START BIRTHDAY
========================= */

function startBirthday(){

    let name =
        document
        .getElementById("nameInput")
        .value
        .trim();

    if(name === ""){
        alert("Please enter a name!");
        return;
    }

    document
        .getElementById("birthdayName")
        .textContent =
        name.toUpperCase() + "!!!";

    document
        .getElementById("inputScreen")
        .style.display = "none";

    document
        .getElementById("birthday")
        .style.display = "block";

    createWatermarks(name);
    createConfetti();
    createParticles();

}


/* =========================
   WATERMARKS
========================= */

function createWatermarks(name){

    const container =
        document.getElementById("watermarks");

    container.innerHTML = "";

    let text =
        "HAPPY BIRTHDAY " +
        name.toUpperCase() +
        "!!!";

    for(let i=0;i<80;i++){

        let span =
            document.createElement("span");

        span.textContent = text;

        container.appendChild(span);

    }

}


/* =========================
   CONFETTI
========================= */

function createConfetti(){

    for(let i=0;i<80;i++){

        let confetti =
            document.createElement("div");

        confetti.className =
            "confetti";

        confetti.style.left =
            Math.random()*100 + "%";

        confetti.style.animationDuration =
            (3 + Math.random()*5) + "s";

        confetti.style.animationDelay =
            Math.random()*5 + "s";

        confetti.style.transform =
            `rotate(${Math.random()*360}deg)`;

        document
            .getElementById("birthday")
            .appendChild(confetti);

    }

}


/* =========================
   PARTICLES
========================= */

function createParticles(){

    for(let i=0;i<60;i++){

        let particle =
            document.createElement("div");

        particle.className =
            "particle";

        particle.style.left =
            Math.random()*100 + "%";

        particle.style.top =
            Math.random()*100 + "%";

        particle.style.animationDelay =
            Math.random()*3 + "s";

        document
            .getElementById("birthday")
            .appendChild(particle);

    }

}


/* =========================
   VIDEO RECORDING
========================= */

async function recordVideo(){

    const birthday =
        document.getElementById("birthday");

    const button =
        document.getElementById("recordBtn");

    button.textContent =
        "🔴 Recording...";

    button.classList.add("recording");

    /*
       Record the screen using
       browser screen capture.
    */

    try{

        const stream =
            await navigator.mediaDevices
            .getDisplayMedia({
                video:{
                    frameRate:30
                },
                audio:false
            });

        const recorder =
            new MediaRecorder(stream,{
                mimeType:"video/webm"
            });

        let chunks=[];

        recorder.ondataavailable =
            event => {

                if(event.data.size > 0){
                    chunks.push(event.data);
                }

            };

        recorder.onstop = () => {

            const blob =
                new Blob(
                    chunks,
                    {
                        type:"video/webm"
                    }
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                "birthday-video.webm";

            a.click();

            URL.revokeObjectURL(url);

            button.textContent =
                "🎥 Create Video";

            button.classList.remove(
                "recording"
            );

        };

        recorder.start();

        /*
           Record for 10 seconds
        */

        setTimeout(() => {

            recorder.stop();

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        },10000);

    }

    catch(error){

        console.log(error);

        button.textContent =
            "🎥 Create Video";

        button.classList.remove(
            "recording"
        );

    }

}

</script>

</body>
</html>
